  domain: "onehappytable.com"
  tagline: "Beautiful tables for every occasion"

visual:
  primary_color: "#8B3A52"
  accent_color: "#D4A853"
  background_color: "#FDFAF6"
  font_headings: "Playfair Display"
  font_body: "Lato"
  logo_paths:
    favicon: "/images/brand/favicon.ico"
    header_svg: "/images/brand/logo-header.svg"
