<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 40" width="240" height="40" role="img" aria-label="One Happy Table">

  <!-- Place setting mark: plate + crossed cutlery -->
  <g transform="translate(22,20)">
    <!-- Plate circle -->
    <circle cx="0" cy="0" r="11" fill="none" stroke="#8B3A52" stroke-width="1.6"/>
    <circle cx="0" cy="0" r="7.5" fill="none" stroke="#8B3A52" stroke-width="0.75" opacity="0.45"/>
    <!-- Fork (left) -->
    <line x1="-17" y1="-9" x2="-17" y2="10" stroke="#D4A853" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="-19.5" y1="-9" x2="-19.5" y2="-3" stroke="#D4A853" stroke-width="1.1" stroke-linecap="round"/>
    <line x1="-17" y1="-9" x2="-17" y2="-3" stroke="#D4A853" stroke-width="1.1" stroke-linecap="round"/>
    <line x1="-14.5" y1="-9" x2="-14.5" y2="-3" stroke="#D4A853" stroke-width="1.1" stroke-linecap="round"/>
    <!-- Knife (right) -->
    <line x1="17" y1="-9" x2="17" y2="10" stroke="#D4A853" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M17,-9 Q20,-6 17,-1" fill="#D4A853" stroke="none"/>
  </g>

  <!-- Hairline separator -->
  <line x1="46" y1="7" x2="46" y2="33" stroke="#8B3A52" stroke-width="0.75" opacity="0.25"/>

  <!-- "ONE HAPPY" — small tracked caps -->
  <text x="55" y="17"
    font-family="Georgia,'Times New Roman',serif"
    font-size="9"
    font-weight="400"
    letter-spacing="3.5"
    fill="#8B3A52">ONE HAPPY</text>

  <!-- "Table" — larger, warmer -->
  <text x="55" y="34"
    font-family="Georgia,'Times New Roman',serif"
    font-size="17"
    font-weight="700"
    letter-spacing="0.3"
    fill="#8B3A52">Table</text>

</svg>
