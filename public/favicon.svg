<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Burgundy rounded square background -->
  <rect width="32" height="32" rx="6" fill="#8B3A52"/>
  <!-- Plate in white, centred -->
  <g transform="translate(16,16)">
    <circle cx="0" cy="0" r="9" fill="none" stroke="#ffffff" stroke-width="1.6"/>
    <circle cx="0" cy="0" r="6" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.5"/>
    <!-- Fork left -->
    <line x1="-13" y1="-7" x2="-13" y2="8" stroke="#D4A853" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="-11.2" y1="-7" x2="-11.2" y2="-2" stroke="#D4A853" stroke-width="1" stroke-linecap="round"/>
    <line x1="-14.8" y1="-7" x2="-14.8" y2="-2" stroke="#D4A853" stroke-width="1" stroke-linecap="round"/>
    <!-- Knife right -->
    <line x1="13" y1="-7" x2="13" y2="8" stroke="#D4A853" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M13,-7 Q15.5,-4 13,0" fill="#D4A853" stroke="none"/>
