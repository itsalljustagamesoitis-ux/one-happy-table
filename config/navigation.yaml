# One Happy Table — flat navigation (hubs are top-level, no categories)
# A single wrapper category is used internally for data consistency
# but never displayed in the UI. Breadcrumbs: Home > Hub > Article

categories:
  - label: "Home Entertaining"
    slug: "home-entertaining"
    hubs:
      - slug: "dinnerware"
        label: "Dinnerware & China"
        url: "/dinnerware/"
        description: "Everyday and fine china, stoneware, plate sets, and complete dinnerware collections"

      - slug: "glassware"
        label: "Glassware & Crystal"
        url: "/glassware/"
        description: "Wine glasses, crystal stemware, everyday glassware, and barware essentials"

      - slug: "linens"
        label: "Table Linens"
        url: "/linens/"
        description: "Tablecloths, placemats, cloth napkins, and table runners for every occasion"

      - slug: "serveware"
        label: "Serveware"
        url: "/serveware/"
        description: "Serving platters, bowls, trays, cake stands, and hosting essentials"

      - slug: "decor"
        label: "Decor & Candles"
        url: "/decor/"
        description: "Centerpieces, candles, candleholders, vases, and table decor"
