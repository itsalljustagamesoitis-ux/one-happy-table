bio_short: "Wendy Collins has spent twenty years hosting everything from weeknight dinners to wedding receptions, and she believes the right table makes every meal feel like a celebration."

bio_full: |
  Wendy Collins grew up in a family where the dinner table was the center of everything — Sunday roasts, holiday feasts, impromptu dinner parties that stretched past midnight. After studying interior design and spending a decade styling tables for events and private clients in Charleston, she turned her obsession into One Happy Table.

  She's tested hundreds of dinnerware sets, owned more tablecloths than she'll admit, and has strong opinions about why your wine glasses matter more than you think. Her goal is simple: help you create a table that feels intentional and welcoming, whether you're hosting ten or just setting something beautiful for two.

